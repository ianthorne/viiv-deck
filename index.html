<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViiV deck — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ViiV brand — subtle application (60 / 30 / 10). Physical cards stay monochrome for print. */
  :root{
    --viiv-red:#E40046; --viiv-red-hover:#C4003C;
    --viiv-navy:#071D49; --viiv-sand:#D7A27E; --viiv-sand-tint:#F7EFE9;
    --viiv-bg:#FFFFFF; --viiv-bg-warm:#FBF8F5; --viiv-gray:#5B6472; --viiv-border:#E7E4E0;
    --navy-soft:#9AA5BC;
    --ink:var(--viiv-navy); --paper:var(--viiv-bg); --muted:var(--viiv-gray); --soft:var(--viiv-border); --wash:var(--viiv-sand-tint);
    --r:10px; --r-sm:8px; --r-lg:12px;
    --shadow:0 1px 2px rgba(7,29,73,.05),0 6px 18px rgba(7,29,73,.06);
    --focus:0 0 0 3px rgba(228,0,70,.22);
    --font:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--viiv-bg-warm);color:var(--ink);font-family:var(--font);
    font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:32px 24px 90px}

  header{display:flex;justify-content:space-between;align-items:center;gap:20px;
    border-bottom:2px solid var(--viiv-sand);padding-bottom:16px;margin-bottom:28px;flex-wrap:wrap}
  .left{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brandwrap{display:flex;align-items:center;gap:14px}
  .homelink{text-decoration:none;color:inherit;border-radius:8px}
  .homelink:hover .brand{text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--viiv-sand)}
  .homelink:focus-visible{outline:none;box-shadow:var(--focus)}
  .backchip{display:none;font-size:12px;font-weight:500;padding:5px 11px;border:1px solid var(--navy-soft);border-radius:999px;background:var(--paper);color:var(--ink)}
  .backchip.show{display:inline-block}
  .logo{height:22px;width:auto;display:block}
  .brand{font-size:19px;font-weight:600;line-height:1.15;margin:0;letter-spacing:-.01em}
  .brand small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:3px}
  .ctl{display:flex;gap:12px;align-items:center;font-size:12px}
  .seg-toggle{display:inline-flex;border:1px solid var(--soft);border-radius:999px;background:var(--paper);padding:2px}
  .seg-toggle button{border:none;padding:5px 12px;background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-size:12px;font-weight:500;border-radius:999px}
  .seg-toggle button.on{background:var(--viiv-red);color:#fff}
  .seg-toggle button:focus-visible{outline:none;box-shadow:var(--focus)}

  .rail{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 26px;font-size:11.5px;color:var(--muted)}
  .rail span{border:1px solid var(--soft);padding:3px 10px;border-radius:999px;background:var(--paper)}
  .rail span.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}
  .rail span.done{border-color:var(--navy-soft);color:var(--ink)}

  .kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:500}
  h2{font-size:26px;font-weight:600;line-height:1.2;margin:0 0 8px;max-width:26ch;letter-spacing:-.01em}
  p.lead{font-size:16px;color:var(--ink);margin:0 0 22px;max-width:62ch}
  .muted{color:var(--muted)}
  .note{font-size:12.5px;color:var(--muted);margin-top:12px;max-width:62ch}
  .rules{font-size:16px;font-weight:500;line-height:1.45;border-left:3px solid var(--viiv-sand);padding-left:14px;margin:0 0 20px;max-width:60ch}
  .legend{font-size:12px;color:var(--muted);margin:-4px 0 10px;padding:6px 10px;border:1px solid var(--soft);border-radius:999px;display:inline-block;background:var(--paper)}
  .onflag{font-size:12px;border:1px solid var(--navy-soft);color:var(--ink);display:inline-block;padding:4px 10px;border-radius:999px;margin:0 0 16px;background:var(--paper)}

  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:6px}
  .mode{border:1px solid var(--soft);border-radius:var(--r-lg);padding:22px 22px 20px;background:var(--paper);text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
  .mode:hover{border-color:var(--navy-soft);transform:translateY(-1px)}
  .mode:focus-visible{outline:none;box-shadow:var(--shadow),var(--focus)}
  .mode.dashed{border-style:dashed;border-color:var(--navy-soft)}
  .mode .name{font-size:20px;font-weight:600;line-height:1.2}
  .mode .for{font-size:12.5px;color:var(--muted)}
  .mode .desc{font-size:14px}
  .mode .sym{width:28px;height:28px}
  .how{max-width:64ch;margin:22px 0 0}
  .how summary{cursor:pointer;font-size:13.5px;font-weight:500;padding:10px 0;border-top:1px solid var(--soft);border-bottom:1px solid var(--soft);list-style:none;display:flex;justify-content:space-between}
  .how summary::-webkit-details-marker{display:none}
  .how summary::after{content:"+";color:var(--muted)}
  .how details[open] summary::after,.how[open] summary::after{content:"\2013"}
  .how ol{margin:12px 0 0;padding-left:20px;font-size:14px}
  .how li{margin:0 0 6px}

  /* physical card 85x120mm — mirrors print: line, tab, symbol; navy on white */
  .cardwrap{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:26px;align-items:start}
  @media (max-width:720px){ .cardwrap{grid-template-columns:1fr} }
  .card{aspect-ratio:85/120;border:1px solid var(--navy-soft);border-radius:var(--r-lg);padding:20px;position:relative;display:flex;flex-direction:column;background:var(--paper);box-shadow:var(--shadow)}
  .card.dashed{border-style:dashed}
  .card.double{border:3px double var(--ink)}
  .card .tab{position:absolute;top:-1px;height:14px;width:38px;background:var(--viiv-sand);border-radius:0 0 6px 6px}
  .card .sym{width:26px;height:26px;margin-bottom:10px;margin-top:6px}
  .card .ck{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:500}
  .card .nm{font-size:22px;font-weight:600;line-height:1.1;margin-bottom:4px}
  .card .meta{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .card .body{font-size:13.5px}
  .card .ph{margin-top:auto;font-size:11px;color:var(--muted);border-top:1px dashed var(--soft);padding-top:8px}

  .dossier{border-top:1px solid var(--soft)}
  .dossier details{border-bottom:1px solid var(--soft)}
  .dossier summary{cursor:pointer;padding:10px 0;font-size:13.5px;font-weight:500;list-style:none;display:flex;justify-content:space-between}
  .dossier summary::-webkit-details-marker{display:none}
  .dossier summary::after{content:"+";color:var(--muted)}
  .dossier details[open] summary::after{content:"\2013"}
  .dossier .rows{padding:0 0 12px;font-size:13.5px}
  .dossier .row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:3px 0}
  .dossier .row b{font-weight:500;color:var(--muted)}
  .dossier .flag{font-size:11px;color:var(--muted);border:1px dashed var(--soft);padding:3px 8px;display:inline-block;margin-top:8px;border-radius:6px}

  .voice{border-left:3px solid var(--viiv-sand);background:var(--wash);border-radius:0 var(--r) var(--r) 0;padding:12px 16px;margin:14px 0}
  .voice .who{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:500}
  .voice p{margin:0;font-size:17px;font-weight:500;line-height:1.4}
  .hidden-list{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
  .hf{border:1px dashed var(--navy-soft);border-radius:var(--r-sm);padding:10px 12px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--paper)}
  .hf.rev{border-style:solid;border-color:var(--viiv-sand);background:var(--wash)}
  .hf .txt{font-size:13.5px}
  .hf .cue{font-size:11.5px;color:var(--muted);margin-top:3px}
  .hf button{white-space:nowrap}

  textarea{width:100%;min-height:92px;border:1px solid var(--soft);border-radius:var(--r-sm);padding:10px 12px;font:inherit;font-size:14px;resize:vertical;background:var(--paper);color:var(--ink)}
  textarea:focus-visible,input:focus-visible{outline:none;border-color:var(--viiv-red);box-shadow:var(--focus)}
  .actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-size:14px;font-weight:500;padding:9px 18px;border:1px solid var(--ink);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s}
  button:hover{background:var(--wash)}
  button.primary{background:var(--viiv-red);border-color:var(--viiv-red);color:#fff}
  button.primary:hover{background:var(--viiv-red-hover);border-color:var(--viiv-red-hover)}
  button.link{border:none;padding:9px 0;text-decoration:underline;text-underline-offset:3px;background:none}
  button.link:hover{background:none;color:var(--viiv-red)}
  button.small{font-size:12px;padding:5px 11px}
  button:disabled{opacity:.45;cursor:not-allowed}
  button:focus-visible{outline:none;box-shadow:var(--focus)}
  .choices{display:flex;flex-direction:column;gap:8px;max-width:62ch}
  .choices label{border:1px solid var(--soft);border-radius:var(--r-sm);background:var(--paper);padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:14px}
  .choices label:hover{border-color:var(--navy-soft)}
  .choices label:has(input:checked){border-color:var(--viiv-red);box-shadow:inset 0 0 0 1px var(--viiv-red)}
  .choices input{margin-top:3px;accent-color:var(--viiv-red)}
  .err{display:none;font-size:13px;background:var(--wash);border:1px solid var(--viiv-sand);border-radius:var(--r-sm);padding:7px 11px;margin-top:8px}

  .bprompt{border:1px solid var(--soft);border-radius:var(--r);background:var(--paper);padding:18px 20px;margin-bottom:14px;box-shadow:var(--shadow)}
  .bprompt .t{font-size:18px;font-weight:600;margin:0 0 4px}
  .bprompt .s{font-size:13.5px;color:var(--muted);margin:0 0 12px}
  .bprompt .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:720px){ .bprompt .two{grid-template-columns:1fr} }
  .bprompt label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500}
  .bprompt textarea{min-height:70px}

  /* treatment-path board (Mode 1) */
  .routes{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 22px}
  .rchip{font-size:13px;padding:7px 12px;border:1px solid var(--soft);border-radius:999px;background:var(--paper);color:var(--ink)}
  .rchip.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .rchip:hover{border-color:var(--navy-soft)}
  .path{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:0 0 6px}
  @media (max-width:860px){ .path{grid-template-columns:repeat(3,1fr)} }
  @media (max-width:560px){ .path{grid-template-columns:repeat(2,1fr)} }
  .pcard{border:1px solid var(--navy-soft);border-radius:var(--r-lg);background:var(--paper);padding:14px 12px 12px;position:relative;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);min-height:190px}
  .pcard.knelt{border-color:var(--ink);border-width:2px}
  .pcard.loopt{border-style:dashed}
  .pcard.weet{border-color:var(--soft)}
  .pcard .tab{position:absolute;top:-1px;left:14px;height:12px;width:32px;background:var(--viiv-sand);border-radius:0 0 6px 6px}
  .pcard .sym{width:24px;height:24px;margin-top:8px}
  .pcard .pt{font-size:13.5px;font-weight:600;line-height:1.25}
  .pcard .ps{font-size:11.5px;color:var(--muted);line-height:1.4;flex:1}
  .pcard .lean{font-size:10.5px;color:var(--ink);background:var(--wash);border:1px solid var(--viiv-sand);border-radius:999px;padding:2px 8px;align-self:flex-start}
  .sort{display:flex;border:1px solid var(--soft);border-radius:999px;overflow:hidden;margin-top:6px}
  .sort button{flex:1;border:none;border-radius:0;padding:5px 0;font-size:11px;font-weight:500;background:var(--paper);color:var(--ink)}
  .sort button:hover{background:var(--wash)}
  .sort button.on{background:var(--ink);color:#fff}
  .hint{font-size:12.5px;color:var(--muted);margin:0 0 20px}
  .kpanel{border:1px solid var(--soft);border-radius:var(--r);background:var(--paper);padding:16px 18px;margin:0 0 12px;box-shadow:var(--shadow)}
  .kpanel .kt{font-size:16px;font-weight:600;margin:0 0 2px;display:flex;align-items:center;gap:8px}
  .kpanel .kt .sym{width:20px;height:20px;margin:0}
  .kpanel .say{margin:10px 0 12px}
  .kpanel .say .line{font-size:15px}
  /* AM voice-over — the training layer */
  .say{background:var(--wash);border-radius:var(--r);padding:16px 18px;margin:0 0 18px;max-width:64ch}
  .say .ck{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:500}
  .say .line{font-size:17px;font-weight:500;line-height:1.4;margin:0 0 10px}
  .say .why{font-size:12.5px;color:var(--muted);border-top:1px solid rgba(215,162,126,.45);padding-top:8px}
  .say .why b{font-weight:500;color:var(--ink)}
  /* bridge panel */
  .practice{border:1px solid var(--soft);border-radius:var(--r);background:var(--paper);padding:16px 18px;margin:0 0 18px;max-width:64ch;box-shadow:var(--shadow)}
  .practice .ck{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:500}
  .practice .lead2{font-size:13.5px;margin:0 0 10px}
  .practice .pin{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--soft);font-size:13.5px}
  .practice .pin b{font-weight:500}
  .practice .pin .mn{color:var(--muted);font-size:12.5px;margin-top:2px}
  .practice.none{border-style:dashed;box-shadow:none;background:transparent;color:var(--muted);font-size:13px}

  .log{border-top:1px solid var(--soft);margin-top:30px;padding-top:18px}
  .entry{border-left:3px solid var(--viiv-sand);padding:2px 0 2px 14px;margin:0 0 16px;font-size:14px}
  .entry .q{color:var(--muted);font-size:12px;margin-bottom:3px}
  .revealed{border:1px solid var(--viiv-sand);background:var(--wash);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px;font-size:13.5px}
  .revealed .ck{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:500}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="left">
      <a href="#" class="brandwrap homelink" onclick="home();return false;">
        <img class="logo" src="assets/viiv-logo.svg" alt="ViiV Healthcare" onerror="this.style.display='none'">
        <h1 class="brand">ViiV deck<small id="tag"></small></h1>
      </a>
      <button class="backchip" id="backChip" onclick="home()"></button>
    </div>
    <div class="ctl">
      <div class="seg-toggle" id="roleCtl" style="display:none"></div>
      <div class="seg-toggle" id="langCtl"></div>
    </div>
  </header>
  <div class="rail" id="rail"></div>
  <div id="stage"></div>
</div>

<script>

  box:'<svg class="sym" viewBox="0 0 26 26" fill="none" stroke="#071D49" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9 L13 5 L21 9 L21 18 L13 22 L5 18 Z M5 9 L13 13 L21 9 M13 13 V22"/></svg>',
  loop:'<svg class="sym" viewBox="0 0 26 26" fill="none" stroke="#071D49" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13 A7 7 0 1 1 17.5 7.7"/><path d="M17.5 4.5 L17.5 8 L21 8"/></svg>',
  circle:'<svg class="sym" viewBox="0 0 26 26" fill="none" stroke="#071D49" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="13" r="9"/></svg>',
  triangle:'<svg class="sym" viewBox="0 0 26 26" fill="none" stroke="#071D49" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4 L22 21 L4 21 Z"/></svg>',
  cross:'<svg class="sym" viewBox="0 0 26 26" fill="none" stroke="#071D49" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6 L20 20 M20 6 L6 20"/></svg>',
  grid:'<svg class="sym" viewBox="0 0 26 26" fill="none" stroke="#071D49" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="5" width="16" height="16"/><path d="M5 13 H21 M13 5 V21"/></svg>'
};

/* ============ State ============ */
let S = { lang:"nl", mode:null, role:"doc", i:0, profile:null, twist:null, revealed:[], caps:{}, log:[] };
const t = k => T[S.lang][k];
const L = o => (o && typeof o==="object" && !Array.isArray(o) && ("nl" in o)) ? (o[S.lang] ?? o.nl) : o;
const F = x => String(x).replace(/\[naam\]|\[name\]/g, S.profile ? S.profile.name : "");

function setLang(l){ S.lang=l; document.documentElement.lang=l; render(); }
function setRole(r){ S.role=r; render(); }
function start(mode){
  S.mode=mode; S.i=0; S.revealed=[]; S.caps={}; S.sort={}; S.route=null;
  if(mode==="m2"){
    S.profile = PROFILES[Math.floor(Math.random()*PROFILES.length)];
    S.twist   = TWISTS[Math.floor(Math.random()*TWISTS.length)];
    S.role="doc";
  }
  render();
}
function home(){ S.mode=null; S.i=0; render(); }

/* ============ Render ============ */
function render(){
  document.getElementById("tag").textContent = t("tag");
  const bc=document.getElementById("backChip"); bc.textContent="\u2190 "+t("home"); bc.className="backchip"+(S.mode?" show":"");
  document.getElementById("langCtl").innerHTML = ["nl","en"].map(l=>
    `<button class="${S.lang===l?'on':''}" onclick="setLang('${l}')" aria-pressed="${S.lang===l}">${l.toUpperCase()}</button>`).join("");
  const rc = document.getElementById("roleCtl");
  if(S.mode==="m2"){
    rc.style.display="inline-flex";
    rc.innerHTML = [["doc",t("role_doc")],["fac",t("role_fac")]].map(([r,lbl])=>
      `<button class="${S.role===r?'on':''}" onclick="setRole('${r}')" aria-pressed="${S.role===r}">${lbl}</button>`).join("");
  } else rc.style.display="none";

  const rail=document.getElementById("rail"), stage=document.getElementById("stage");
  if(!S.mode){ rail.innerHTML=""; stage.innerHTML=startScreen(); return; }
  if(S.mode==="log"){ rail.innerHTML=""; stage.innerHTML=logScreen(); return; }
  const steps = S.mode==="m1" ? t("m1_steps") : t("m2_steps");
  rail.innerHTML = steps.map((s,idx)=>`<span class="${idx===S.i?'on':idx<S.i?'done':''}">${s}</span>`).join("");
  stage.innerHTML = S.mode==="m1" ? mode1() : mode2();
}

function startScreen(){
  const pp = practiceProfile();
  return `
    <div class="kicker">${t("start_k")}</div>
    <h2>${t("start_h")}</h2>
    <p class="lead">${t("start_lead")}</p>
    <p class="rules">${t("rules")}</p>
    ${pp?`<div class="onflag">${t("practice_on")}</div>`:""}
    <div class="modes">
      <button class="mode" onclick="start('m1')">${SYM.grid}<div class="name">${t("m1_name")}</div><div class="for">${t("m1_for")}</div><div class="desc">${t("m1_desc")}</div></button>
      <button class="mode dashed" onclick="start('m2')">${SYM.circle}<div class="name">${t("m2_name")}</div><div class="for">${t("m2_for")}</div><div class="desc">${t("m2_desc")}</div></button>
    </div>
    <details class="how"><summary>${t("how_k")}</summary><ol>${t("how").map(x=>`<li>${x}</li>`).join("")}</ol></details>
    <p class="note">${t("start_note")}</p>`;
}

/* ---- Mode 1: treatment-path scan ---- */
function mode1(){
  const total=t("m1_steps").length;
  if(S.i===1){
    return `<div class="kicker">${t("step")} 2 / ${total}</div><h2>${t("finish")}</h2><p class="lead">${t("log_lead")}</p>${script("m1")}${nav()}`;
  }
  const route = ROUTES.find(r=>r.k===S.route);
  const leans = route ? route.leans : [];
  const by = st => SCAN.filter(p=>S.sort[p.k]===st);
  const lab = () => `style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px;font-weight:500"`;
  const panel = (p, sayTxt, whyTxt, fields) => `
      <div class="kpanel">
        <div class="kt">${SYM[p.sym]}${L(p.t)}</div>
        <div class="say"><div class="ck">${t("say_k")}</div><p class="line">\u201c${sayTxt}\u201d</p><div class="why"><b>${t("why_k")}:</b> ${whyTxt}</div></div>
        <div style="display:grid;grid-template-columns:${fields.length>1?'1fr 1fr':'1fr'};gap:12px">
          ${fields.map(([id,lbl])=>`<div><label ${lab()}>${lbl}</label><textarea id="${id}_${p.k}" style="min-height:70px">${esc(S.caps[p.k+"_"+id]||"")}</textarea></div>`).join("")}
        </div>
      </div>`;
  const kn=by("knelt"), lo=by("loopt"), we=by("weet");
  return `
    <div class="kicker">${t("step")} 1 / ${total}</div>
    <h2>${t("m1_h")}</h2>
    <p class="lead">${t("m1_lead")}</p>
    ${script("m1")}
    <div class="kicker">${t("route_k")}</div>
    <p class="hint" style="margin-bottom:8px">${t("route_lead")}</p>
    <div class="routes">
      <button class="rchip ${!S.route?'on':''}" onclick="setRoute(null)">${t("route_none")}</button>
      ${ROUTES.map(r=>`<button class="rchip ${S.route===r.k?'on':''}" onclick="setRoute('${r.k}')" title="${esc(L(r.d))}">${L(r.n)}</button>`).join("")}
    </div>
    <div class="path">
      ${SCAN.map(p=>{ const st=S.sort[p.k]||""; return `
        <div class="pcard ${st}">
          <div class="tab"></div>${SYM[p.sym]}
          <div class="pt">${L(p.t)}</div>
          <div class="ps">${L(p.s)}</div>
          ${leans.includes(p.k)?`<span class="lean">${t("leans")}</span>`:""}
          <div class="sort">
            ${["loopt","knelt","weet"].map(v=>`<button class="${st===v?'on':''}" onclick="setSort('${p.k}','${v}')">${t("sort_"+v)}</button>`).join("")}
          </div>
        </div>`; }).join("")}
    </div>
    <p class="hint">${t("sorted_hint")}</p>
    ${kn.length?`<div class="kicker">${t("knelt_k")}</div>`:""}
    ${kn.map(p=>panel(p, L(p.say), L(p.why), [["w",t("m1_what")],["h",t("m1_help")]])).join("")}
    ${lo.length?`<div class="kicker" style="margin-top:6px">${t("loopt_k")}</div>`:""}
    ${lo.map(p=>panel(p, t("say_loopt"), t("why_loopt"), [["ok",t("loopt_what")],["okw",t("loopt_why")]])).join("")}
    ${we.length?`<div class="kicker" style="margin-top:6px">${t("weet_k")}</div>`:""}
    ${we.map(p=>panel(p, t("say_weet"), t("why_weet"), [["who",t("weet_q")]])).join("")}
    ${nav()}`;
}
function setSort(k,v){ collect(); S.sort[k] = (S.sort[k]===v) ? "" : v; render(); }
function setRoute(r){ collect(); S.route=r; render(); }

/* ---- Mode 2: patient case ---- */
function mode2(){
  const P = S.profile, doc = S.role==="doc", n = t("m2_steps").length;
  const head = (k,h) => `<div class="kicker">${t("step")} ${S.i+1} / ${n} · ${t(k)}</div><div class="legend">${F(t("legend"))}</div><h2>${t(h)}</h2>` + (doc?"":script("m2"));
  if(S.i===0) return `
      ${head("case_k","case_h")}
      <p class="lead">${F(doc?t("case_lead_doc"):t("case_lead_fac"))}</p>
      <div class="cardwrap">
        <div>${card(P)}<div class="actions" style="margin-top:10px"><button class="small" onclick="shuffleProfile()">${t("shuffle")}</button></div></div>
        <div>${dossier(P)}${doc?"":hiddenPanel(P,false)}</div>
      </div>
      ${nav()}`;
  if(S.i===1) return `
      ${head("open_k","open_h")}
      <p class="lead">${F(doc?t("open_lead_doc"):t("open_lead_fac"))}</p>
      ${doc ? `<textarea id="cap" placeholder="${t("open_q")}">${esc(S.caps.open||"")}</textarea><div class="err" id="err">${t("need_text")}</div>` : voice(P, L(P.prio))}
      ${nav()}`;
  if(S.i===2) return `
      ${head("explore_k","explore_h")}
      <p class="lead">${F(doc?t("explore_lead_doc"):t("explore_lead_fac"))}</p>
      ${doc ? surfacedPanel(P)+`<textarea id="cap" placeholder="${t("explore_q")}" style="margin-top:14px">${esc(S.caps.explore||"")}</textarea><div class="err" id="err">${t("need_text")}</div>` : hiddenPanel(P,true)}
      ${nav()}`;
  if(S.i===3){ const opts=t("plan_opts"); return `
      ${head("plan_k","plan_h")}
      <p class="lead">${t("plan_lead")}</p>
      ${practicePanel()}
      <div class="choices">${opts.map(o=>`<label><input type="radio" name="plan" value="${esc(o)}" ${S.caps.plan===o?'checked':''}> <span>${o}</span></label>`).join("")}</div>
      <div class="err" id="err">${t("need_choice")}</div>
      ${nav()}`; }
  if(S.i===4) return `
      ${head("twist_k","twist_h")}
      <p class="lead">${doc?t("twist_lead_doc"):t("twist_lead_fac")}</p>
      <div class="cardwrap"><div><div class="card dashed"><div class="tab" style="right:18px"></div>${SYM.cross}
        <div class="ck">Life-event</div><div class="body" style="font-family:var(--display);font-size:17px;line-height:1.35">${L(S.twist)}</div></div>
        <div class="actions" style="margin-top:10px"><button class="small" onclick="otherTwist()">${t("other_twist")}</button><span class="muted" style="font-size:12px">${TWISTS.indexOf(S.twist)+1} / ${TWISTS.length}</span></div></div></div>
      ${nav()}`;
  return `
      ${head("hold_k","hold_h")}
      <p class="lead">${t("hold_lead")}</p>
      <textarea id="cap" placeholder="${t("hold_q")}">${esc(S.caps.hold||"")}</textarea><div class="err" id="err">${t("need_text")}</div>
      ${nav()}`;
}

/* ---- components ---- */
function card(P){
  return `<div class="card ${P.style}">
    <div class="tab" style="${P.tab==='left'?'left:18px':'right:18px'}"></div>${SYM[P.sym]}
    <div class="ck">${t("case_k")}</div><div class="nm">${P.name}</div><div class="meta">${L(P.meta)}</div>
    <div class="body">${L(P.prio)}</div>
    <div class="ph">${t("d_reg")}</div></div>`;
}
function rows(list){ return `<div class="rows">${list.map(([k,v])=>`<div class="row"><b>${k}</b><span>${v}</span></div>`).join("")}</div>`; }
function dossier(P){
  const sec=(lbl,list,open)=>`<details ${open?'open':''}><summary>${lbl}</summary>${rows(L(list))}</details>`;
  return `<div class="dossier">
    ${sec(t("d_demo"),P.demo,true)}${sec(t("d_med"),P.med,true)}${sec(t("d_care"),P.care,false)}${sec(t("d_life"),P.life,false)}
    <details><summary>${t("d_prio")}</summary><div class="rows"><p style="margin:0">${L(P.prio)}</p></div></details>
    <div class="flag">${t("d_flag")}</div></div>`;
}
function voice(P,line){ return `<div class="voice"><div class="who">${P.name}</div><p>\u201c${line}\u201d</p></div>`; }
function hiddenPanel(P,interactive){
  return `<div style="margin-top:16px"><div class="kicker">${t("hidden_k")}</div><div class="hidden-list">
    ${P.hidden.map((h,idx)=>{ const r=S.revealed.includes(idx); return `<div class="hf ${r?'rev':''}">
      <div><div class="txt">${L(h)}</div><div class="cue">${t("cue")} ${L(h.cue)}</div></div>
      ${interactive?`<button class="small" onclick="revealFact(${idx})" ${r?'disabled':''}>${r?t("revealed"):t("reveal")}</button>`:""}
    </div>`;}).join("")}</div></div>`;
}
function surfacedPanel(P){
  const items = S.revealed.map(idx=>L(P.hidden[idx]));
  return `<div class="revealed"><div class="ck">${F(t("surfaced"))}</div>
    ${items.length?items.map(x=>`<div>— ${x}</div>`).join(""):`<span class="muted">${F(t("nothing_yet"))}</span>`}</div>`;
}
function revealFact(idx){ if(!S.revealed.includes(idx)) S.revealed.push(idx); render(); }

/* AM voice-over: the literal line per step, plus why — the training layer */
function script(mode){
  const arr=t(mode+"_say"), e=arr[S.i]; if(!e) return "";
  const nm = S.profile ? S.profile.name : "";
  const fill = x => x.replace(/\[naam\]|\[name\]/g, nm);
  return `<div class="say"><div class="ck">${t("say_k")}</div><p class="line">\u201c${fill(e.say)}\u201d</p><div class="why"><b>${t("why_k")}:</b> ${fill(e.why)}</div></div>`;
}
/* Bridge: practice-level barriers from the most recent scan this session */
function practiceProfile(){
  const r = S.log.find(x=>x.mode==="m1"); if(!r) return null;
  const items = r.items.filter(it=>it.key && (it.st==="knelt" || it.st==="loopt")); return items.length?items:null;
}
function practicePanel(){
  const pp = practiceProfile();
  if(!pp) return `<div class="practice none">${t("practice_none")}</div>`;
  const kn=pp.filter(it=>it.st==="knelt"), lo=pp.filter(it=>it.st==="loopt");
  const row=(it,txt,sub)=>{ const sc=SCAN.find(x=>x.k===it.key); return `<div class="pin"><b>${L(sc.t)}</b><div>${esc(txt||"\u2014")}${sub?`<div class="mn">${t("why_k")}: ${esc(sub)}</div>`:""}<div class="mn">${t("practice_means")}: ${L(sc.m)}</div></div></div>`; };
  return `<div class="practice"><div class="ck">${t("practice_k")}</div><p class="lead2">${t("practice_lead")}</p>
    ${kn.length?`<div class="ck" style="margin-top:8px">${t("sort_knelt")}</div>`+kn.map(it=>row(it,it.w)).join(""):""}
    ${lo.length?`<div class="ck" style="margin-top:12px">${t("works_lbl")}</div>`+lo.map(it=>row(it,it.ok,it.okw)).join(""):""}</div>`;
}
function shuffleProfile(){
  const idx=(PROFILES.indexOf(S.profile)+1)%PROFILES.length;
  S.profile=PROFILES[idx]; S.revealed=[]; render();
}
function otherTwist(){
  const idx=(TWISTS.indexOf(S.twist)+1)%TWISTS.length; S.twist=TWISTS[idx]; render();
}

function nav(){
  const total = S.mode==="m1" ? t("m1_steps").length : t("m2_steps").length;
  const last = S.i===total-1;
  return `<div class="actions">
    ${S.i>0?`<button onclick="back()">${t("back")}</button>`:""}
    <button class="primary" onclick="next()">${last?t("finish"):t("next")}</button>
    <button class="link" onclick="home()">${t("home")}</button></div>`;
}

/* ---- flow ---- */
const val  = id => (document.getElementById(id)||{value:""}).value.trim();
const stLbl = st => st ? t("sort_"+st) : "";
const show = el => { if(el) el.style.display="block"; };
function collect(){
  const err=document.getElementById("err");
  if(S.mode==="m1"){
    if(S.i===0) SCAN.forEach(p=>{ ["w","h","ok","okw","who"].forEach(id=>{ const el=document.getElementById(id+"_"+p.k); if(el) S.caps[p.k+"_"+id]=el.value.trim(); }); });
    return true;
  }
  const doc=S.role==="doc";
  if(S.i===1 && doc){ const v=val("cap"); if(!v){show(err);return false;} S.caps.open=v; }
  if(S.i===2 && doc){ const v=val("cap"); if(!v){show(err);return false;} S.caps.explore=v; }
  if(S.i===3){ const sel=document.querySelector('input[name="plan"]:checked'); if(!sel){show(err);return false;} S.caps.plan=sel.value; }
  if(S.i===5){ const v=val("cap"); if(!v){show(err);return false;} S.caps.hold=v; }
  return true;
}
function next(){
  if(!collect()) return;
  const total = S.mode==="m1" ? t("m1_steps").length : t("m2_steps").length;
  if(S.i<total-1){ S.i++; render(); } else finish();
}
function back(){ collect(); S.i--; render(); }

function finish(){
  const e = {mode:S.mode, items:[]};
  if(S.mode==="m1"){
    const route = ROUTES.find(r=>r.k===S.route);
    e.title = t("m1_name") + (route ? " · " + L(route.n) : "");
    SCAN.forEach(p=>{ const st=S.sort[p.k]||""; if(!st) return;
      const g=id=>S.caps[p.k+"_"+id]||"";
      e.items.push({key:p.k, k:L(p.t), st, w:st==="knelt"?g("w"):"", h:st==="knelt"?g("h"):"", ok:st==="loopt"?g("ok"):"", okw:st==="loopt"?g("okw"):"", who:st==="weet"?g("who"):""}); });
  } else {
    e.title = `${t("m2_name")} · ${S.profile.name}`;
    e.twist = L(S.twist);
    e.surfaced = S.revealed.map(i=>L(S.profile.hidden[i]));
    [["open",t("open_k")],["explore",t("explore_k")],["plan",t("plan_k")],["hold",t("hold_k")]].forEach(([k,lbl])=>{ if(S.caps[k]) e.items.push({k:lbl, w:S.caps[k]}); });
  }
  S.log.unshift(e); S.mode="log"; render();
}

function logScreen(){
  const n=S.log.length;
  const body = S.log.map((r,idx)=>`<div class="entry">
      <div class="q">${t("round")} ${n-idx} · ${r.title}</div>
      ${r.items.map(it=>{ const body = it.w||it.ok||it.who||""; const tail = it.h ? `→ ${esc(it.h)}` : it.okw ? `${t("why_k")}: ${esc(it.okw)}` : ""; return `<div><strong>${it.k}:</strong> ${it.st?`<em>${stLbl(it.st)}</em>${body?" — ":""}`:""}${esc(body)}${tail?` <span class="muted">${tail}</span>`:""}</div>`; }).join("")}
      ${r.surfaced&&r.surfaced.length?`<div class="q" style="margin-top:6px">${t("surfaced_lbl")}: ${r.surfaced.map(esc).join(" · ")}</div>`:""}
      ${r.twist?`<div class="q">${t("twist_lbl")}: ${esc(r.twist)}</div>`:""}
    </div>`).join("");
  return `
    <div class="kicker">${t("log_k")}</div><h2>${t("log_h")}</h2><p class="lead">${t("log_lead")}</p>
    <div class="log">${body||`<p class="muted">${t("log_none")}</p>`}</div>
    <div class="actions">
      <button class="primary" onclick="home()">${t("newround")}</button>
      <button onclick="copyLog(this)">${t("copy")}</button>
    </div>`;
}
function copyLog(b){
  const n=S.log.length;
  const txt=S.log.map((r,idx)=>`${t("round")} ${n-idx} — ${r.title}\n`+
    r.items.map(it=>{ const body=it.w||it.ok||it.who||""; const tail=it.h?`  → ${it.h}`:it.okw?`  (${t("why_k")}: ${it.okw})`:""; return `  ${it.k}: ${it.st?stLbl(it.st)+(body?" — ":""):""}${body}${tail}`; }).join("\n")+
    (r.surfaced&&r.surfaced.length?`\n  ${t("surfaced_lbl")}: ${r.surfaced.join(" · ")}`:"")+
    (r.twist?`\n  ${t("twist_lbl")}: ${r.twist}`:"")).join("\n\n");
  navigator.clipboard.writeText(txt).then(()=>{ const o=b.textContent; b.textContent=t("copied"); setTimeout(()=>b.textContent=o,1400); });
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

render();
</script>
</body>
</html>
