<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViiV deck — prototype</title>
<style>
  :root{
    --paper:#ffffff; --ink:#000000; --muted:#6a6a6a; --soft:#c9c9c9; --wash:#f6f6f6;
    --display:"Century Schoolbook","New Century Schoolbook","Century Schoolbook L",Georgia,"Times New Roman",serif;
    --body:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:36px 24px 90px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;
    border-bottom:1px solid var(--ink);padding-bottom:14px;margin-bottom:26px;flex-wrap:wrap}
  .brand{font-family:var(--display);font-size:24px;line-height:1.1;margin:0;font-weight:400}
  .brand small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);margin-top:4px}
  .ctl{display:flex;gap:14px;align-items:center;font-size:12px}
  .seg-toggle{display:inline-flex;border:1px solid var(--ink)}
  .seg-toggle button{border:none;padding:6px 12px;background:var(--paper);color:var(--ink);cursor:pointer;font:inherit;font-size:12px}
  .seg-toggle button.on{background:var(--ink);color:var(--paper)}
  .seg-toggle button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}

  .rail{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 26px;font-size:11px;color:var(--muted)}
  .rail span{border:1px solid var(--soft);padding:2px 9px}
  .rail span.on{border-color:var(--ink);color:var(--ink)}
  .rail span.done{border-color:var(--ink);color:var(--muted)}

  .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
  h2{font-family:var(--display);font-size:28px;font-weight:400;line-height:1.15;margin:0 0 8px;max-width:24ch}
  p.lead{font-size:16px;color:#1c1c1c;margin:0 0 22px;max-width:62ch}
  .muted{color:var(--muted)}
  .note{font-size:12.5px;color:var(--muted);margin-top:10px;max-width:62ch}

  .modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:8px}
  .mode{border:1px solid var(--ink);padding:22px 22px 18px;background:var(--paper);text-align:left;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:10px}
  .mode:hover{background:var(--wash)}
  .mode:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .mode.dashed{border-style:dashed}
  .mode .name{font-family:var(--display);font-size:22px;line-height:1.15}
  .mode .for{font-size:12px;color:var(--muted)}
  .mode .desc{font-size:14px;color:#1c1c1c}
  .mode .sym{width:28px;height:28px}

  .cardwrap{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:26px;align-items:start}
  @media (max-width:720px){ .cardwrap{grid-template-columns:1fr} }
  .card{aspect-ratio:85/120;border:1px solid var(--ink);padding:18px;position:relative;display:flex;flex-direction:column;background:var(--paper)}
  .card.dashed{border-style:dashed}
  .card .tab{position:absolute;top:-1px;height:16px;width:36px;border:1px solid var(--ink);border-bottom:none;background:var(--paper)}
  .card .sym{width:26px;height:26px;margin-bottom:10px}
  .card .ck{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .card .nm{font-family:var(--display);font-size:22px;line-height:1.1;margin-bottom:4px}
  .card .meta{font-size:12.5px;color:var(--muted);margin-bottom:12px}
  .card .body{font-size:13px;color:#1c1c1c}
  .card .ph{margin-top:auto;font-size:11px;color:var(--muted);border-top:1px dashed var(--soft);padding-top:8px}

  .dossier{border-top:1px solid var(--ink)}
  .dossier details{border-bottom:1px solid var(--soft)}
  .dossier summary{cursor:pointer;padding:10px 0;font-size:13px;list-style:none;display:flex;justify-content:space-between}
  .dossier summary::-webkit-details-marker{display:none}
  .dossier summary::after{content:"+";color:var(--muted)}
  .dossier details[open] summary::after{content:"\2013"}
  .dossier .rows{padding:0 0 12px;font-size:13.5px}
  .dossier .row{display:grid;grid-template-columns:150px 1fr;gap:12px;padding:3px 0}
  .dossier .row b{font-weight:500;color:var(--muted)}
  .dossier .flag{font-size:11px;color:var(--muted);border:1px dashed var(--soft);padding:2px 6px;display:inline-block;margin-top:6px}

  .voice{border-left:2px solid var(--ink);padding:4px 0 4px 16px;margin:14px 0}
  .voice .who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
  .voice p{margin:0 0 6px;font-family:var(--display);font-size:17px;line-height:1.35}
  .hidden-list{display:flex;flex-direction:column;gap:8px;margin:8px 0 4px}
  .hf{border:1px dashed var(--ink);padding:10px 12px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
  .hf.rev{border-style:solid;background:var(--wash)}
  .hf .txt{font-size:13.5px}
  .hf .cue{font-size:11.5px;color:var(--muted);margin-top:3px}
  .hf button{white-space:nowrap}

  textarea{width:100%;min-height:92px;border:1px solid var(--ink);padding:10px 12px;font:inherit;font-size:14px;resize:vertical;background:var(--paper);color:var(--ink)}
  textarea:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
  .actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
  button{font:inherit;font-size:14px;padding:9px 18px;border:1px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer}
  button.primary{background:var(--ink);color:var(--paper)}
  button.link{border:none;padding:9px 0;text-decoration:underline;background:none}
  button.small{font-size:12px;padding:5px 10px}
  button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .choices{display:flex;flex-direction:column;gap:8px;max-width:62ch}
  .choices label{border:1px solid var(--soft);padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;font-size:14px}
  .choices label:hover{border-color:var(--ink)}
  .choices input{margin-top:3px}
  .err{display:none;font-size:13px;border:1px solid var(--ink);padding:6px 10px;margin-top:8px}

  .bprompt{border:1px solid var(--ink);padding:16px 18px;margin-bottom:14px}
  .bprompt .t{font-family:var(--display);font-size:19px;margin:0 0 4px}
  .bprompt .s{font-size:13px;color:var(--muted);margin:0 0 10px}
  .bprompt .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:720px){ .bprompt .two{grid-template-columns:1fr} }
  .bprompt label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px}
  .bprompt textarea{min-height:70px}

  .log{border-top:1px solid var(--ink);margin-top:30px;padding-top:18px}
  .entry{border-left:2px solid var(--ink);padding:2px 0 2px 14px;margin:0 0 16px;font-size:14px}
  .entry .q{color:var(--muted);font-size:12px;margin-bottom:3px}
  .revealed{border:1px solid var(--soft);padding:10px 12px;margin-top:10px;font-size:13.5px;background:var(--wash)}
  .revealed .ck{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">ViiV deck<small id="tag"></small></h1>
    <div class="ctl">
      <div class="seg-toggle" id="roleCtl" style="display:none"></div>
      <div class="seg-toggle" id="langCtl"></div>
    </div>
  </header>
  <div class="rail" id="rail"></div>
  <div id="stage"></div>
</div>

  {k:"fin", t:{nl:"Financiering & VoReZorg", en:"Funding & VoReZorg"},
   s:{nl:"Wie draagt de kosten van extra bezoeken, toediening en thuiszorg? Welke route is haalbaar in deze praktijk?", en:"Who carries the cost of extra visits, administration and home care? Which route is workable in this practice?"}},
  {k:"fup", t:{nl:"Opvolging", en:"Follow-up"},
   s:{nl:"Hoe worden patiënten opgevolgd die niet reageren of afspraken missen? Wie belt, wie bewaakt?", en:"How are non-responding or no-show patients followed up? Who calls, who monitors?"}}
];

const SYM = {
  circle:'<svg class="sym" viewBox="0 0 26 26" fill="none" stroke="#000" stroke-width="1.3"><circle cx="13" cy="13" r="9"/></svg>',
  triangle:'<svg class="sym" viewBox="0 0 26 26" fill="none" stroke="#000" stroke-width="1.3"><path d="M13 4 L22 21 L4 21 Z"/></svg>',
  cross:'<svg class="sym" viewBox="0 0 26 26" fill="none" stroke="#000" stroke-width="1.3"><path d="M6 6 L20 20 M20 6 L6 20"/></svg>',
  grid:'<svg class="sym" viewBox="0 0 26 26" fill="none" stroke="#000" stroke-width="1.3"><rect x="5" y="5" width="16" height="16"/><path d="M5 13 H21 M13 5 V21"/></svg>'
};

/* ============ State ============ */
let S = { lang:"nl", mode:null, role:"doc", i:0, profile:null, twist:null, revealed:[], caps:{}, log:[] };
const t = k => T[S.lang][k];
const L = o => (o && typeof o==="object" && !Array.isArray(o) && ("nl" in o)) ? (o[S.lang] ?? o.nl) : o;

function setLang(l){ S.lang=l; document.documentElement.lang=l; render(); }
function setRole(r){ S.role=r; render(); }
function start(mode){
  S.mode=mode; S.i=0; S.revealed=[]; S.caps={};
  if(mode==="m2"){
    S.profile = PROFILES[Math.floor(Math.random()*PROFILES.length)];
    S.twist   = TWISTS[Math.floor(Math.random()*TWISTS.length)];
    S.role="doc";
  }
  render();
}
function home(){ S.mode=null; S.i=0; render(); }

/* ============ Render ============ */
function render(){
  document.getElementById("tag").textContent = t("tag");
  document.getElementById("langCtl").innerHTML = ["nl","en"].map(l=>
    `<button class="${S.lang===l?'on':''}" onclick="setLang('${l}')" aria-pressed="${S.lang===l}">${l.toUpperCase()}</button>`).join("");
  const rc = document.getElementById("roleCtl");
  if(S.mode==="m2"){
    rc.style.display="inline-flex";
    rc.innerHTML = [["doc",t("role_doc")],["fac",t("role_fac")]].map(([r,lbl])=>
      `<button class="${S.role===r?'on':''}" onclick="setRole('${r}')" aria-pressed="${S.role===r}">${lbl}</button>`).join("");
  } else rc.style.display="none";

  const rail=document.getElementById("rail"), stage=document.getElementById("stage");
  if(!S.mode){ rail.innerHTML=""; stage.innerHTML=startScreen(); return; }
  if(S.mode==="log"){ rail.innerHTML=""; stage.innerHTML=logScreen(); return; }
  const steps = S.mode==="m1" ? t("m1_steps") : t("m2_steps");
  rail.innerHTML = steps.map((s,idx)=>`<span class="${idx===S.i?'on':idx<S.i?'done':''}">${s}</span>`).join("");
  stage.innerHTML = S.mode==="m1" ? mode1() : mode2();
}

function startScreen(){
  return `
    <div class="kicker">${t("start_k")}</div>
    <h2>${t("start_h")}</h2>
    <p class="lead">${t("start_lead")}</p>
    <div class="modes">
      <button class="mode" onclick="start('m1')">${SYM.grid}<div class="name">${t("m1_name")}</div><div class="for">${t("m1_for")}</div><div class="desc">${t("m1_desc")}</div></button>
      <button class="mode dashed" onclick="start('m2')">${SYM.circle}<div class="name">${t("m2_name")}</div><div class="for">${t("m2_for")}</div><div class="desc">${t("m2_desc")}</div></button>
    </div>
    <p class="note">${t("start_note")}</p>`;
}

/* ---- Mode 1: treatment-path scan ---- */
function mode1(){
  const total = SCAN.length+1;
  if(S.i === SCAN.length){
    return `<div class="kicker">${t("step")} ${S.i+1} / ${total}</div><h2>${t("finish")}</h2><p class="lead">${t("log_lead")}</p>${nav()}`;
  }
  const p = SCAN[S.i], w = S.caps[p.k+"_w"]||"", h = S.caps[p.k+"_h"]||"";
  return `
    <div class="kicker">${t("step")} ${S.i+1} / ${total}</div>
    <h2>${t("m1_h")}</h2>
    <p class="lead">${t("m1_lead")}</p>
    <div class="bprompt">
      <p class="t">${L(p.t)}</p><p class="s">${L(p.s)}</p>
      <div class="two">
        <div><label>${t("m1_what")}</label><textarea id="w">${esc(w)}</textarea></div>
        <div><label>${t("m1_help")}</label><textarea id="h">${esc(h)}</textarea></div>
      </div>
    </div>
    ${nav()}`;
}

/* ---- Mode 2: patient case ---- */
function mode2(){
  const P = S.profile, doc = S.role==="doc", n = t("m2_steps").length;
  const head = (k,h) => `<div class="kicker">${t("step")} ${S.i+1} / ${n} · ${t(k)}</div><h2>${t(h)}</h2>`;
  if(S.i===0) return `
      ${head("case_k","case_h")}
      <p class="lead">${doc?t("case_lead_doc"):t("case_lead_fac")}</p>
      <div class="cardwrap">${card(P)}<div>${dossier(P)}${doc?"":hiddenPanel(P,false)}</div></div>
      ${nav()}`;
  if(S.i===1) return `
      ${head("open_k","open_h")}
      <p class="lead">${doc?t("open_lead_doc"):t("open_lead_fac")}</p>
      ${doc ? `<textarea id="cap" placeholder="${t("open_q")}">${esc(S.caps.open||"")}</textarea><div class="err" id="err">${t("need_text")}</div>` : voice(P, L(P.prio))}
      ${nav()}`;
  if(S.i===2) return `
      ${head("explore_k","explore_h")}
      <p class="lead">${doc?t("explore_lead_doc"):t("explore_lead_fac")}</p>
      ${doc ? surfacedPanel(P)+`<textarea id="cap" placeholder="${t("explore_q")}" style="margin-top:14px">${esc(S.caps.explore||"")}</textarea><div class="err" id="err">${t("need_text")}</div>` : hiddenPanel(P,true)}
      ${nav()}`;
  if(S.i===3){ const opts=t("plan_opts"); return `
      ${head("plan_k","plan_h")}
      <p class="lead">${t("plan_lead")}</p>
      <div class="choices">${opts.map(o=>`<label><input type="radio" name="plan" value="${esc(o)}" ${S.caps.plan===o?'checked':''}> <span>${o}</span></label>`).join("")}</div>
      <div class="err" id="err">${t("need_choice")}</div>
      ${nav()}`; }
  if(S.i===4) return `
      ${head("twist_k","twist_h")}
      <p class="lead">${doc?t("twist_lead_doc"):t("twist_lead_fac")}</p>
      <div class="cardwrap"><div class="card dashed"><div class="tab" style="right:18px"></div>${SYM.cross}
        <div class="ck">Life-event</div><div class="body" style="font-family:var(--display);font-size:17px;line-height:1.35">${L(S.twist)}</div></div></div>
      ${nav()}`;
  return `
      ${head("hold_k","hold_h")}
      <p class="lead">${t("hold_lead")}</p>
      <textarea id="cap" placeholder="${t("hold_q")}">${esc(S.caps.hold||"")}</textarea><div class="err" id="err">${t("need_text")}</div>
      ${nav()}`;
}

/* ---- components ---- */
function card(P){
  return `<div class="card ${P.style}">
    <div class="tab" style="${P.tab==='left'?'left:18px':'right:18px'}"></div>${SYM[P.sym]}
    <div class="ck">${t("case_k")}</div><div class="nm">${P.name}</div><div class="meta">${L(P.meta)}</div>
    <div class="body">${L(P.prio)}</div>
    <div class="ph">${t("d_reg")}</div></div>`;
}
function rows(list){ return `<div class="rows">${list.map(([k,v])=>`<div class="row"><b>${k}</b><span>${v}</span></div>`).join("")}</div>`; }
function dossier(P){
  const sec=(lbl,list,open)=>`<details ${open?'open':''}><summary>${lbl}</summary>${rows(L(list))}</details>`;
  return `<div class="dossier">
    ${sec(t("d_demo"),P.demo,true)}${sec(t("d_med"),P.med,true)}${sec(t("d_care"),P.care,false)}${sec(t("d_life"),P.life,false)}
    <details><summary>${t("d_prio")}</summary><div class="rows"><p style="margin:0">${L(P.prio)}</p></div></details>
    <div class="flag">${t("d_flag")}</div></div>`;
}
function voice(P,line){ return `<div class="voice"><div class="who">${P.name}</div><p>\u201c${line}\u201d</p></div>`; }
function hiddenPanel(P,interactive){
  return `<div style="margin-top:16px"><div class="kicker">${t("hidden_k")}</div><div class="hidden-list">
    ${P.hidden.map((h,idx)=>{ const r=S.revealed.includes(idx); return `<div class="hf ${r?'rev':''}">
      <div><div class="txt">${L(h)}</div><div class="cue">${t("cue")} ${L(h.cue)}</div></div>
      ${interactive?`<button class="small" onclick="revealFact(${idx})" ${r?'disabled':''}>${r?t("revealed"):t("reveal")}</button>`:""}
    </div>`;}).join("")}</div></div>`;
}
function surfacedPanel(P){
  const items = S.revealed.map(idx=>L(P.hidden[idx]));
  return `<div class="revealed"><div class="ck">${t("surfaced")}</div>
    ${items.length?items.map(x=>`<div>— ${x}</div>`).join(""):`<span class="muted">${t("nothing_yet")}</span>`}</div>`;
}
function revealFact(idx){ if(!S.revealed.includes(idx)) S.revealed.push(idx); render(); }

function nav(){
  const total = S.mode==="m1" ? SCAN.length+1 : t("m2_steps").length;
  const last = S.i===total-1;
  return `<div class="actions">
    ${S.i>0?`<button onclick="back()">${t("back")}</button>`:""}
    <button class="primary" onclick="next()">${last?t("finish"):t("next")}</button>
    <button class="link" onclick="home()">${t("home")}</button></div>`;
}

/* ---- flow ---- */
const val  = id => (document.getElementById(id)||{value:""}).value.trim();
const show = el => { if(el) el.style.display="block"; };
function collect(){
  const err=document.getElementById("err");
  if(S.mode==="m1"){
    if(S.i<SCAN.length){ const p=SCAN[S.i]; S.caps[p.k+"_w"]=val("w"); S.caps[p.k+"_h"]=val("h"); }
    return true;
  }
  const doc=S.role==="doc";
  if(S.i===1 && doc){ const v=val("cap"); if(!v){show(err);return false;} S.caps.open=v; }
  if(S.i===2 && doc){ const v=val("cap"); if(!v){show(err);return false;} S.caps.explore=v; }
  if(S.i===3){ const sel=document.querySelector('input[name="plan"]:checked'); if(!sel){show(err);return false;} S.caps.plan=sel.value; }
  if(S.i===5){ const v=val("cap"); if(!v){show(err);return false;} S.caps.hold=v; }
  return true;
}
function next(){
  if(!collect()) return;
  const total = S.mode==="m1" ? SCAN.length+1 : t("m2_steps").length;
  if(S.i<total-1){ S.i++; render(); } else finish();
}
function back(){ collect(); S.i--; render(); }

function finish(){
  const e = {mode:S.mode, items:[]};
  if(S.mode==="m1"){
    e.title = t("m1_name");
    SCAN.forEach(p=>{ const w=S.caps[p.k+"_w"], h=S.caps[p.k+"_h"]; if(w||h) e.items.push({k:L(p.t), w, h}); });
  } else {
    e.title = `${t("m2_name")} · ${S.profile.name}`;
    e.twist = L(S.twist);
    e.surfaced = S.revealed.map(i=>L(S.profile.hidden[i]));
    [["open",t("open_k")],["explore",t("explore_k")],["plan",t("plan_k")],["hold",t("hold_k")]].forEach(([k,lbl])=>{ if(S.caps[k]) e.items.push({k:lbl, w:S.caps[k]}); });
  }
  S.log.unshift(e); S.mode="log"; render();
}

function logScreen(){
  const n=S.log.length;
  const body = S.log.map((r,idx)=>`<div class="entry">
      <div class="q">${t("round")} ${n-idx} · ${r.title}</div>
      ${r.items.map(it=>`<div><strong>${it.k}:</strong> ${esc(it.w||"")}${it.h?` <span class="muted">→ ${esc(it.h)}</span>`:""}</div>`).join("")}
      ${r.surfaced&&r.surfaced.length?`<div class="q" style="margin-top:6px">${t("surfaced_lbl")}: ${r.surfaced.map(esc).join(" · ")}</div>`:""}
      ${r.twist?`<div class="q">${t("twist_lbl")}: ${esc(r.twist)}</div>`:""}
    </div>`).join("");
  return `
    <div class="kicker">${t("log_k")}</div><h2>${t("log_h")}</h2><p class="lead">${t("log_lead")}</p>
    <div class="log">${body||`<p class="muted">${t("log_none")}</p>`}</div>
    <div class="actions">
      <button class="primary" onclick="home()">${t("newround")}</button>
      <button onclick="copyLog(this)">${t("copy")}</button>
    </div>`;
}
function copyLog(b){
  const n=S.log.length;
  const txt=S.log.map((r,idx)=>`${t("round")} ${n-idx} — ${r.title}\n`+
    r.items.map(it=>`  ${it.k}: ${it.w||""}${it.h?`  → ${it.h}`:""}`).join("\n")+
    (r.surfaced&&r.surfaced.length?`\n  ${t("surfaced_lbl")}: ${r.surfaced.join(" · ")}`:"")+
    (r.twist?`\n  ${t("twist_lbl")}: ${r.twist}`:"")).join("\n\n");
  navigator.clipboard.writeText(txt).then(()=>{ const o=b.textContent; b.textContent=t("copied"); setTimeout(()=>b.textContent=o,1400); });
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

render();
</script>
</body>
</html>
